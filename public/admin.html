<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin — Wealthspring</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-[#070A14] text-white p-6 font-sans">
<h1 class="text-[28px] font-extrabold">Admin Panel</h1>
<div class="mt-4 flex gap-2">
<button onclick="tab('dep')" id="b-dep" class="px-4 py-2 bg-white text-black rounded-full font-bold">Deposits</button>
<button onclick="tab('wd')" id="b-wd" class="px-4 py-2 bg-white/10 rounded-full">Withdrawals</button>
<button onclick="tab('sup')" id="b-sup" class="px-4 py-2 bg-white/10 rounded-full">Support</button>
<button onclick="tab('bal')" id="b-bal" class="px-4 py-2 bg-white/10 rounded-full">Balances</button>
</div>
<div id="tab-dep" class="mt-6"><div id="depList" class="space-y-2"></div></div>
<div id="tab-wd" class="mt-6 hidden"><div id="wdList" class="space-y-2"></div></div>
<div id="tab-sup" class="mt-6 hidden"><div id="supList" class="space-y-2"></div></div>
<div id="tab-bal" class="mt-6 hidden"><div id="balList" class="space-y-2"></div></div>
<script>
const API='https://wealthspring-backend.onrender.com';
function tab(id){
 document.querySelectorAll('[id^="tab-"]').forEach(e=>e.classList.add('hidden'));
 document.getElementById('tab-'+id).classList.remove('hidden');
 document.querySelectorAll('[id^="b-"]').forEach(e=>e.className='px-4 py-2 bg-white/10 rounded-full');
 document.getElementById('b-'+id).className='px-4 py-2 bg-white text-black rounded-full font-bold';
 if(id==='dep') loadDep(); if(id==='wd') loadWd(); if(id==='sup') loadSup(); if(id==='bal') loadBal();
}
async function loadDep(){
 const r=await fetch(API+'/api/admin/deposits'); const {deposits}=await r.json();
 document.getElementById('depList').innerHTML=deposits.reverse().map(d=>`<div class="bg-white/5 border border-white/10 p-4 rounded-xl flex justify-between"><div><div class="font-bold">${d.email} — $${d.amount}</div><div class="text-[11px] text-white/50">${d.txHash.slice(0,40)}... | ${new Date(d.createdAt).toLocaleString()} | <span class="${d.status==='approved'?'text-green-400':'text-yellow-400'}">${d.status}</span></div></div><div class="flex gap-2"><button onclick="approve(${d.id})" class="px-3 py-1 bg-green-400 text-black rounded-full text-[12px]">Approve</button><button onclick="reject(${d.id})" class="px-3 py-1 bg-white/10 rounded-full text-[12px]">Reject</button></div></div>`).join('')||'No deposits';
}
async function loadWd(){
 const r=await fetch(API+'/api/admin/withdraws'); const {withdraws}=await r.json();
 document.getElementById('wdList').innerHTML=withdraws.reverse().map(w=>`<div class="bg-white/5 p-4 rounded-xl flex justify-between"><div><div class="font-bold">${w.email} — $${w.amount} → ${w.address.slice(0,20)}...</div><div class="text-[11px] text-white/50">${new Date(w.date).toLocaleString()} | ${w.status||'pending'}</div></div><button onclick="wdApprove(${w.id})" class="px-3 py-1 bg-white text-black rounded-full text-[12px]">Mark Paid</button></div>`).join('')||'No withdraws';
}
async function loadSup(){
 const r=await fetch(API+'/api/admin/supports'); const {supports}=await r.json();
 document.getElementById('supList').innerHTML=supports.reverse().map(s=>`<div class="bg-white/5 p-4 rounded-xl"><div class="font-bold text-[13px]">${s.email} — ${s.subject}</div><div class="text-[12px] text-white/60 mt-1">${s.message}</div><div class="text-[10px] text-white/40 mt-2">${new Date(s.date).toLocaleString()}</div></div>`).join('')||'No messages';
}
async function loadBal(){
 const r=await fetch(API+'/api/admin/balances'); const {balances}=await r.json();
 document.getElementById('balList').innerHTML=Object.entries(balances).map(([e,b])=>`<div class="bg-white/5 p-4 rounded-xl flex justify-between"><span>${e}</span><span class="font-bold">$${b.toFixed(2)}</span></div>`).join('')||'No balances';
}
async function approve(id){ await fetch(API+'/api/admin/approve',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id})}); loadDep(); }
async function reject(id){ await fetch(API+'/api/admin/reject',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id})}); loadDep(); }
async function wdApprove(id){ await fetch(API+'/api/admin/withdraw-approve',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id})}); loadWd(); }
loadDep(); setInterval(loadDep,5000);
</script></body></html>
