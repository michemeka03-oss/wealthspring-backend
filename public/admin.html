<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wealthspring Admin</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white p-4">
<h1 class="text-2xl font-bold mb-4">Admin - Deposits</h1>
<div id="status" class="mb-4 text-yellow-400">Loading...</div>
<div id="list" class="space-y-3"></div>

<script>
const API = "https://wealthspring-backend.onrender.com";

async function load() {
  document.getElementById('status').textContent = "Loading deposits...";
  try {
    const res = await fetch(`${API}/api/admin/deposits`);
    const data = await res.json();
    if (!data.deposits || data.deposits.length === 0) {
      document.getElementById('status').textContent = "No deposits yet";
      document.getElementById('list').innerHTML = "<p class='text-gray-400'>Waiting for deposits...</p>";
      return;
    }
    document.getElementById('status').textContent = `${data.deposits.length} deposits`;
    document.getElementById('list').innerHTML = data.deposits.map(d => `
      <div class="bg-gray-800 p-4 rounded-lg border ${d.status==='approved'?'border-green-500':'border-yellow-600'}">
        <div class="flex justify-between items-start">
          <div>
            <p class="font-bold">$${d.amount} - ${d.email}</p>
            <p class="text-sm text-gray-400 break-all">TX: ${d.txHash}</p>
            <p class="text-xs text-gray-500">${new Date(d.createdAt).toLocaleString()}</p>
            <span class="text-xs px-2 py-1 rounded ${d.status==='approved'?'bg-green-600':'bg-yellow-600'}">${d.status}</span>
          </div>
          ${d.status==='pending' ? `<button onclick="approve('${d.id}')" class="bg-green-600 hover:bg-green-700 px-4 py-2 rounded font-bold">Approve</button>` : `<span class="text-green-400">✓ Done</span>`}
        </div>
      </div>
    `).join('');
  } catch(e){
    document.getElementById('status').textContent = "Error: " + e.message;
  }
}

async function approve(id){
  if(!confirm("Approve this deposit? User balance will update and user gets email.")) return;
  try{
    const res = await fetch(`${API}/api/admin/approve`, {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({id})
    });
    const data = await res.json();
    if(data.success){
      alert("Approved! Balance updated.");
      load();
    } else {
      alert("Failed: " + (data.message||"error"));
    }
  }catch(e){ alert(e.message); }
}

load();
setInterval(load, 10000); // auto refresh every 10 sec
</script>
</body>
</html>
