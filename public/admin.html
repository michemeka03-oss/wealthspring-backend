<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WealthSprings Admin</title>
<style>
body{font-family:Arial;background:#0f172a;color:#fff;padding:20px}
h1{color:#22c55e} h2{margin-top:40px;border-bottom:1px solid #334155;padding-bottom:8px}
table{width:100%;border-collapse:collapse;margin-top:10px;background:#1e293b}
th,td{padding:10px;border:1px solid #334155;text-align:left;font-size:13px}
button{padding:6px 10px;margin:2px;border:none;cursor:pointer;border-radius:4px}
.approve{background:#22c55e;color:#000} .reject{background:#ef4444;color:#fff}
.card{background:#1e293b;padding:15px;border-radius:8px;margin-bottom:15px}
</style>
</head>
<body>
<h1>WealthSprings Admin Dashboard</h1>
<p>Backend: <span id="status">checking...</span> | <button onclick="loadAll()">Refresh All</button></p>

<h2>💰 Deposits (Pending / All)</h2>
<table id="depositsTable"><tr><th>ID</th><th>Email</th><th>Amount</th><th>TxHash</th><th>Status</th><th>Time</th><th>Action</th></tr></table>

<h2>💸 Withdrawals</h2>
<table id="withdrawTable"><tr><th>ID</th><th>Email</th><th>Amount</th><th>Address</th><th>Status</th><th>Action</th></tr></table>

<h2>💬 Support Messages</h2>
<div id="supportList"></div>

<h2>👥 All Balances + Activity Log</h2>
<table id="balanceTable"><tr><th>Email</th><th>Balance</th><th>Deposits Count</th><th>Withdrawals Count</th></tr></table>

<script>
const API = ''; // same domain
async function loadAll(){
  document.getElementById('status').innerText='loading...';
  try{
    const [d,w,s,b] = await Promise.all([
      fetch('/api/admin/deposits').then(r=>r.json()),
      fetch('/api/admin/withdraws').then(r=>r.json()),
      fetch('/api/admin/supports').then(r=>r.json()),
      fetch('/api/admin/balances').then(r=>r.json())
    ]);
    document.getElementById('status').innerText='live ✓';
    renderDeposits(d.deposits||d);
    renderWithdraws(w.withdraws||w);
    renderSupports(s.supports||s);
    renderBalances(b.balances||b, d.deposits||d, w.withdraws||w);
  }catch(e){ document.getElementById('status').innerText='error: '+e; }
}
function renderDeposits(list){
  const tbl=document.getElementById('depositsTable');
  tbl.innerHTML='<tr><th>ID</th><th>Email</th><th>Amount</th><th>TxHash</th><th>Status</th><th>Time</th><th>Action</th></tr>';
  (list||[]).slice().reverse().forEach(item=>{
    const tr=document.createElement('tr');
    tr.innerHTML=`<td>${item.id}</td><td>${item.email}</td><td>$${item.amount}</td><td style="max-width:120px;overflow:hidden">${item.txHash||''}</td><td>${item.status}</td><td>${new Date(item.createdAt).toLocaleString()}</td><td>${item.status==='pending'?`<button class="approve" onclick="approveDep(${item.id})">Approve</button><button class="reject" onclick="rejectDep(${item.id})">Reject</button>`:''}</td>`;
    tbl.appendChild(tr);
  });
}
function renderWithdraws(list){
  const tbl=document.getElementById('withdrawTable');
  tbl.innerHTML='<tr><th>ID</th><th>Email</th><th>Amount</th><th>Address</th><th>Status</th><th>Action</th></tr>';
  (list||[]).slice().reverse().forEach(item=>{
    const tr=document.createElement('tr');
    tr.innerHTML=`<td>${item.id}</td><td>${item.email}</td><td>$${item.amount}</td><td>${item.address||''}</td><td>${item.status}</td><td>${item.status==='pending'?`<button class="approve" onclick="approveWith(${item.id})">Approve</button>`:''}</td>`;
    tbl.appendChild(tr);
  });
}
function renderSupports(list){
  const div=document.getElementById('supportList');
  div.innerHTML='';
  (list||[]).slice().reverse().forEach(item=>{
    const el=document.createElement('div'); el.className='card';
    el.innerHTML=`<b>${item.email}</b> - ${item.subject}<br><small>${new Date(item.date).toLocaleString()}</small><p>${item.message}</p>`;
    div.appendChild(el);
  });
  if(!list||list.length===0) div.innerHTML='<p>No support messages yet</p>';
}
function renderBalances(balMap, deps, withs){
  const tbl=document.getElementById('balanceTable');
  tbl.innerHTML='<tr><th>Email</th><th>Balance</th><th>Deposits</th><th>Withdrawals</th></tr>';
  const emails = new Set([...Object.keys(balMap), ...(deps||[]).map(d=>d.email), ...(withs||[]).map(w=>w.email)]);
  emails.forEach(email=>{
    const tr=document.createElement('tr');
    const depCount=(deps||[]).filter(d=>d.email===email).length;
    const withCount=(withs||[]).filter(w=>w.email===email).length;
    tr.innerHTML=`<td>${email}</td><td>$${balMap[email]||0}</td><td>${depCount}</td><td>${withCount}</td>`;
    tbl.appendChild(tr);
  });
}
async function approveDep(id){ await fetch('/api/admin/approve',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id})}); loadAll(); }
async function rejectDep(id){ await fetch('/api/admin/reject',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id})}); loadAll(); }
async function approveWith(id){ await fetch('/api/admin/withdraw-approve',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id})}); loadAll(); }

loadAll();
setInterval(loadAll, 10000);
</script>
</body>
</html>
